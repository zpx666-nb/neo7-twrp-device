name: Build TWRP vendor_boot
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: Set up job
        env:
          TWRP_VERSION: "12.1"
          LUNCH_TARGET: "omni_RMX5060‑eng"
        run: |
          sudo apt‑get update
          sudo apt‑get install‑y bc bison build‑essential curl flex g++‑multilib gcc‑multilib git gnupg gperf lib32ncurses5‑dev lib32z1‑dev liblz4‑tool libsdl1.2‑dev libwxgtk3.0‑dev libxml2‑utils lzop pngcrush schedtool zip unzip

      - name: Sync TWRP‑12.1 source
        run: |
          git clone https://github.com/minimal‑manifest/twrp‑${{ env.TWRP_VERSION }}.git .
          git submodule update --init --recursive

      - name: Checkout device repo into device folder
        uses: actions/checkout@v4
        with:
          path: device

      - name: Compile TWRP vendor_boot image
        run: |
          source build/envsetup.sh
          lunch ${{ env.LUNCH_TARGET }}
          make‑j$(nproc) vendorbootimage

      - name: Upload build artifact
        uses: actions/upload‑artifact@v4
        with:
          name: twrp‑vendor_boot‑RMX5060
          path: out/target/product/RMX5060/vendor_boot.img
